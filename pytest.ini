[pytest]
testpaths = tests
# Permite "from pages import ...", "from data import ..." e "from support import ..." a partir da raiz do projeto.
pythonpath = .

# URL base usada por page.goto("/rota"). Pode ser sobrescrita na linha de
# comando: pytest --base-url http://localhost:3000
base_url = https://www.saucedemo.com

addopts =
    --browser chromium
    --tracing retain-on-failure
    --output test-results
    --html=reports/report.html
    --self-contained-html
    -v

markers =
    smoke: fluxos críticos, rápidos de rodar (pytest -m smoke)
    regression: regressão por perfil de usuário e cenários de borda (pytest -m regression)
    known_bug: bug conhecido documentado como xfail; aplicado automaticamente pelo conftest (pytest -m known_bug)

xfail_strict = true
