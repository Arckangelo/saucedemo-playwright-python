[pytest]
testpaths = tests
# Permite "from pages import ...", "from data import ..." e "from support import ..." a partir da raiz do projeto.
pythonpath = .

# URL base usada por page.goto("/rota"). Pode ser sobrescrita na linha de
# comando: pytest --base-url http://localhost:3000
base_url = https://www.saucedemo.com

# -p support.site_guard: proteção contra instabilidade do site (SITE INDISPONÍVEL e
# disjuntor). -p support.known_bugs: marker known_bug e conferência da regra dos
# xfail (CLAUDE.md, regra 4). Carregados aqui, e não no conftest, para serem
# registrados antes de qualquer import deles.
addopts =
    -p support.site_guard
    -p support.known_bugs
    --browser chromium
    --tracing retain-on-failure
    --output test-results
    --html=reports/report.html
    --self-contained-html
    -v

markers =
    smoke: fluxos críticos, rápidos de rodar (pytest -m smoke)
    regression: regressão por perfil de usuário e cenários de borda (pytest -m regression)
    known_bug: bug conhecido documentado como xfail; aplicado automaticamente por support/known_bugs.py (pytest -m known_bug)
    allow_js_errors: o teste tolera exceções JavaScript da página; use só com um comentário citando o bug que as gera

xfail_strict = true
