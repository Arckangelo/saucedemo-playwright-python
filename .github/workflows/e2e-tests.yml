name: E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# só leitura do código; o upload de artefatos não precisa de permissão extra
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright + pytest (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip # reaproveita downloads do pip entre execuções

      - name: Criar ambiente virtual (venv)
        run: |
          python -m venv .venv
          # Coloca o .venv/bin no PATH dos próximos steps: "python", "pip",
          # "pytest" e "playwright" passam a ser os do venv, sem precisar
          # de "source .venv/bin/activate" em cada step.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        # --with-deps instala também as bibliotecas de sistema que o Chromium precisa
        run: playwright install --with-deps chromium

      - name: Executar testes
        run: pytest

      - name: Publicar relatório HTML e traces
        if: always() # publica mesmo (e principalmente) quando algum teste falha
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-e2e
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
