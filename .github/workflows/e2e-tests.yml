name: E2E Tests

# Divisão das execuções (detalhes no README, seção "Integração contínua"):
# - push fora da main: só os testes que devem passar (-m "not known_bug"),
#   para feedback rápido;
# - push na main (merge), pull_request, agendamento diário e execução manual:
#   suíte completa, incluindo os testes que documentam bugs conhecidos (xfail).
# Na main (fora de PR), o relatório HTML é publicado no GitHub Pages.
on:
  push:
  pull_request:
  schedule:
    # Todo dia às 09:00 UTC (06:00 em Brasília). O GitHub só agenda a partir da
    # branch padrão e, em repositórios públicos, desativa o agendamento após 60 dias
    # sem atividade no repositório.
    - cron: "0 9 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# só leitura do código; o upload de artefatos não precisa de permissão extra
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright + pytest (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip # reaproveita downloads do pip entre execuções

      - name: Criar ambiente virtual (venv)
        run: |
          python -m venv .venv
          # Coloca o .venv/bin no PATH dos próximos steps: "python", "pip",
          # "pytest" e "playwright" passam a ser os do venv, sem precisar
          # de "source .venv/bin/activate" em cada step.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        # --with-deps instala também as bibliotecas de sistema que o Chromium precisa
        run: playwright install --with-deps chromium

      - name: Executar testes
        # O tipo de evento chega por variável de ambiente, não interpolado no
        # script, para evitar injeção de expressões no shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # -n auto: pytest-xdist distribui os testes entre os núcleos do runner.
          # Na main, o push roda a suíte completa: é dele que sai o relatório publicado.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "Execução rápida (push): sem os testes de bugs conhecidos"
            pytest -n auto -m "not known_bug"
          else
            echo "Execução completa ($EVENT_NAME): inclui os testes de bugs conhecidos"
            pytest -n auto
          fi

      - name: Publicar relatório HTML e traces
        if: always() # publica mesmo (e principalmente) quando algum teste falha
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-e2e
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  publicar-relatorio:
    name: Publicar relatório no GitHub Pages
    needs: e2e
    # Publica mesmo quando algum teste falha (é quando o relatório mais importa),
    # mas só a partir da main e fora de pull request.
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publicar o site no GitHub Pages
      id-token: write # token OIDC exigido pelo deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Um deploy de cada vez; um novo não cancela o que já está em andamento.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Baixar o relatório
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relatorio-e2e
          path: artefato

      - name: Montar o site
        # Só o relatório HTML vai para o site público; os traces ficam no artefato.
        # Valores do GitHub chegam por variável de ambiente, não interpolados no script.
        env:
          REPOSITORIO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir site
          cp artefato/reports/report.html site/relatorio.html
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SauceDemo - Relatórios de testes</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #1f2937; }
              a.card { display: block; padding: 16px; margin: 12px 0; border: 1px solid #d1d5db; border-radius: 8px; text-decoration: none; color: inherit; }
              a.card:hover { border-color: #2563eb; }
              small { color: #6b7280; }
            </style>
          </head>
          <body>
            <h1>SauceDemo · Relatórios de testes</h1>
            <p><small>Gerado pelo CI em __DATA__ (__EVENTO__, commit __COMMIT__) · <a href="https://github.com/__REPOSITORIO__">repositório</a></small></p>
            <a class="card" href="relatorio.html"><strong>Suíte completa</strong><br><small>Relatório do pytest-html, com screenshot de cada falha. Os testes de bugs conhecidos aparecem como XFAIL.</small></a>
            <a class="card" href="https://github.com/__REPOSITORIO__/blob/main/BUGS.md"><strong>Bugs encontrados</strong><br><small>Resumo dos bugs com severidade, teste e issue.</small></a>
            <a class="card" href="https://github.com/__REPOSITORIO__/blob/main/docs/relatorio-de-bugs.pdf"><strong>Relatório de bugs (PDF)</strong><br><small>Passos, evidências e reprodutibilidade de cada bug.</small></a>
          </body>
          </html>
          HTML
          sed -i "s|__DATA__|$(date -u '+%d/%m/%Y %H:%M UTC')|; s|__EVENTO__|${EVENTO}|; s|__COMMIT__|${COMMIT:0:7}|; s|__REPOSITORIO__|${REPOSITORIO}|g" site/index.html

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
