name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # semanal (segunda, 05:00 UTC): pega vulnerabilidades novas em dependências que não mudaram
    - cron: '0 5 * * 1'
  workflow_dispatch:

# mínimo por padrão; cada job pede só o que precisa
permissions:
  contents: read

jobs:
  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # enviar o SARIF para a aba Security
    env:
      # binário oficial com versão e checksum fixos; a gitleaks-action só varre
      # o intervalo de commits do evento, e aqui o objetivo é o histórico completo
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout do código (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check
          tar -xzf "$arquivo" gitleaks
          ./gitleaks version

      - name: Varrer o histórico completo
        run: |
          ./gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Enviar resultados para a aba Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  pip-audit:
    name: Dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar pip-audit
        run: python -m pip install pip-audit==2.10.1

      # o pip-audit não filtra por severidade; o script consulta a base OSV e
      # falha só em vulnerabilidade alta, crítica ou de severidade desconhecida
      - name: Auditar dependências
        run: python .github/scripts/pip_audit_severidade.py requirements.txt
